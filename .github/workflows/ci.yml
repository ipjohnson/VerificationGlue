name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # VerificationGlueReportTrx gives every test application but the NUnit ones the TRX extension, so the
      # run report can name the result of each test the inventory cites.
      - name: Build
        id: build
        env:
          VerificationGlueReportTrx: true
        run: dotnet build VerificationGlue.slnx -c Release

      # NUnit3TestAdapter does not start with the TRX extension, so the NUnit projects run in the next step.
      - name: Run specs
        id: specs
        run: |
          projects=$(grep -o 'Path="[^"]*\.csproj"' VerificationGlue.slnx | cut -d'"' -f2)
          nunit=$(grep -l '"NUnit3TestAdapter"' $projects)
          mkdir -p artifacts/evidence
          printf '%s\n' $projects | grep -vxF "$nunit" | jq -R . \
            | jq -s '{solution: {path: "../../VerificationGlue.slnx", projects: .}}' > artifacts/evidence/specs.slnf
          dotnet test --solution artifacts/evidence/specs.slnf -c Release --no-build \
            --report-trx --results-directory artifacts/evidence/specs

      - name: Run the NUnit projects
        id: nunit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          projects=$(grep -o 'Path="[^"]*\.csproj"' VerificationGlue.slnx | cut -d'"' -f2)
          status=0
          for project in $(grep -l '"NUnit3TestAdapter"' $projects); do
            dotnet test --project "$project" -c Release --no-build || status=1
          done
          exit $status

      # The .Specs projects run on VerificationGlue.Tests. The conformance suites also run on xunit v3,
      # so a defect in VerificationGlue.Tests cannot hide a defect in VerificationGlue or
      # VerificationGlue.Mocks. test/Directory.Build.props describes the xunit build.
      - name: Run the conformance suites on xunit v3
        run: |
          for suite in VerificationGlue.Specs VerificationGlue.Generator.Specs VerificationGlue.Mocks.Specs \
                       VerificationGlue.Mocks.Generator.Specs NSubstituteComparison.Specs; do
            dotnet test --project "test/$suite" -c Release -p:SpecsRunner=xunit
          done

      - name: Run generator benchmarks
        run: >
          dotnet run --project test/Generator.Benchmarks -c Release --no-build --
          --filter '*' --job short --inProcess --artifacts artifacts/benchmarks

      # Fails when the mock generator's median time over 500 interfaces is above a limit in
      # mock-budgets.json. docs/design/mocks.md, Performance, has the figures the limits come from.
      - name: Check generator budgets
        run: >
          dotnet run --project test/Generator.Benchmarks -c Release --no-build --
          budget test/Generator.Benchmarks/mock-budgets.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: generator-benchmarks
          path: artifacts/benchmarks/results/
          if-no-files-found: ignore

      # Also publishes samples/PackageConsumer, a VerificationGlue.Tests project, with Native AOT, runs its
      # tests, and adds their run time to the job summary.
      - name: Pack, consume, run tests under Native AOT and check version mismatch
        id: pack
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: eng/pack-and-consume.sh --no-build

      # Each --step names a profile of docs/design/hardening-matrix.json. The solution run's TRX files serve
      # the profiles of its projects, and a step with - writes no TRX file, so its outcome stands for its
      # profile. The completion gate reads the report.
      - name: Write the run report
        if: always()
        env:
          OUT: artifacts/evidence
          SPECS: ${{ steps.specs.outcome || 'missing' }}
          NUNIT: ${{ steps.nunit.outcome || 'missing' }}
          PACK: ${{ steps.pack.outcome || 'missing' }}
        run: |
          args=()
          for profile in specs specs-tier3 samples-tests xunit xunit-tier2 xunit-tier3 mstest-tier2 mstest-tier3 tunit-tier2 tunit-tier3; do
            args+=(--step specs "$profile" "$SPECS" "$OUT/specs")
          done
          args+=(--step nunit nunit-tier2 "$NUNIT" - --step nunit nunit-tier3 "$NUNIT" -)
          args+=(--step pack packed-tests "$PACK" - --step pack packed-verify "$PACK" - --step pack packed-mocks "$PACK" -)
          dotnet run --project test/Hardening.Reports -c Release -- --output "$OUT" "${args[@]}"

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-report-build
          path: artifacts/evidence/
          retention-days: 30
          if-no-files-found: ignore

  # Times cold builds with the generator off, tier 2 alone and tier 3 in this one job, so the
  # ratios compare builds on the same machine. Fails when a configuration is over a limit in
  # test/ColdBuild/budgets.json. docs/design/verification-glue.md, Performance, has the figures.
  cold-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the benchmark
        run: dotnet build test/ColdBuild -c Release

      - name: Run the cold-build benchmark
        run: >
          dotnet run --project test/ColdBuild -c Release --no-build --
          --repeat 3 --output artifacts/cold-build --budget test/ColdBuild/budgets.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cold-build
          path: |
            artifacts/cold-build/report.md
            artifacts/cold-build/report.json
          if-no-files-found: ignore

  # Runs the pull request cases of docs/design/hardening.md beside cold-build. The step 2 cases in
  # test/Hardening.Specs have a 2-minute budget, its step 3 cases, marked [Trait("Step", "3")], have a
  # 2-minute budget, and the step 4 cases in test/Hardening.Lifecycle.Specs have a 1-minute budget. A
  # run over its budget still runs every case, then fails and reports the overrun. Each step writes a
  # TRX file, and the last steps build the run report and the coverage report from them.
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STEP2_BUDGET_SECONDS: 120
      STEP3_BUDGET_SECONDS: 120
      STEP4_BUDGET_SECONDS: 60
      STEP5_BUDGET_SECONDS: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The step 4 specs build the fixture again when they start. Building it here leaves them nothing to do.
      - name: Build the hardening specs
        id: build
        run: |
          dotnet build test/Hardening.Specs -c Release
          dotnet build test/Hardening.Lifecycle.Specs -c Release
          dotnet build test/Hardening.Lifecycle.Fixture -c Release

      - name: Run the step 2 cases
        id: step2
        env:
          HARDENING_OUTPUT: ${{ github.workspace }}/artifacts/hardening/step2
        run: |
          start=$(date +%s)
          status=0
          dotnet test --project test/Hardening.Specs -c Release --no-build --vg-filter "!trait:Step=3&!trait:Step=5" \
            --report-trx --report-trx-filename results.trx --results-directory "$HARDENING_OUTPUT" || status=$?
          elapsed=$(( $(date +%s) - start ))
          if [ -f "$HARDENING_OUTPUT/report.md" ]; then
            cat "$HARDENING_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "The step 2 cases took $elapsed s of their $STEP2_BUDGET_SECONDS s budget." >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$STEP2_BUDGET_SECONDS" ]; then
            echo "::error::The step 2 cases took $elapsed s, over their $STEP2_BUDGET_SECONDS s budget. Every case ran."
            status=1
          fi
          exit $status

      - name: Run the step 3 cases
        id: step3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HARDENING_OUTPUT: ${{ github.workspace }}/artifacts/hardening/step3
        run: |
          start=$(date +%s)
          status=0
          dotnet test --project test/Hardening.Specs -c Release --no-build --vg-filter "trait:Step=3" \
            --report-trx --report-trx-filename results.trx --results-directory "$HARDENING_OUTPUT" || status=$?
          elapsed=$(( $(date +%s) - start ))
          if [ -f "$HARDENING_OUTPUT/report.md" ]; then
            cat "$HARDENING_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "The step 3 cases took $elapsed s of their $STEP3_BUDGET_SECONDS s budget." >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$STEP3_BUDGET_SECONDS" ]; then
            echo "::error::The step 3 cases took $elapsed s, over their $STEP3_BUDGET_SECONDS s budget. Every case ran."
            status=1
          fi
          exit $status

      - name: Run the step 4 cases
        id: step4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          start=$(date +%s)
          status=0
          dotnet test --project test/Hardening.Lifecycle.Specs -c Release --no-build \
            --report-trx --report-trx-filename results.trx --results-directory artifacts/hardening/step4 || status=$?
          elapsed=$(( $(date +%s) - start ))
          echo "The step 4 cases took $elapsed s of their $STEP4_BUDGET_SECONDS s budget." >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$STEP4_BUDGET_SECONDS" ]; then
            echo "::error::The step 4 cases took $elapsed s, over their $STEP4_BUDGET_SECONDS s budget. Every case ran."
            status=1
          fi
          exit $status

      - name: Run the step 5 cases
        id: step5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HARDENING_OUTPUT: ${{ github.workspace }}/artifacts/hardening/step5
        run: |
          start=$(date +%s)
          status=0
          dotnet test --project test/Hardening.Specs -c Release --no-build --vg-filter "trait:Step=5" \
            --report-trx --report-trx-filename results.trx --results-directory "$HARDENING_OUTPUT" || status=$?
          elapsed=$(( $(date +%s) - start ))
          echo "The step 5 cases took $elapsed s of their $STEP5_BUDGET_SECONDS s budget." >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$STEP5_BUDGET_SECONDS" ]; then
            echo "::error::The step 5 cases took $elapsed s, over their $STEP5_BUDGET_SECONDS s budget. Every case ran."
            status=1
          fi
          exit $status

      # Runs after a failure, a cancellation or a timeout too. A step that was cancelled, skipped or cut
      # short makes the coverage incomplete, and then this step fails. docs/design/hardening.md, Run and
      # coverage reports, describes both reports.
      - name: Write the run report and the coverage report
        if: always()
        env:
          OUT: ${{ github.workspace }}/artifacts/hardening
        run: |
          status=0
          dotnet run --project test/Hardening.Reports -c Release -- --output "$OUT" \
            --step step2 hardening-specs "${{ steps.step2.outcome || 'missing' }}" "$OUT/step2" \
            --step step3 hardening-specs "${{ steps.step3.outcome || 'missing' }}" "$OUT/step3" \
            --step step4 hardening-lifecycle "${{ steps.step4.outcome || 'missing' }}" "$OUT/step4" \
            --step step5 hardening-specs "${{ steps.step5.outcome || 'missing' }}" "$OUT/step5" || status=$?
          if [ -f "$OUT/coverage.md" ]; then
            cat "$OUT/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hardening
          path: artifacts/hardening/
          retention-days: 30
          if-no-files-found: ignore

  # Generates and compiles a mock for every public interface in the BCL and the top 100 NuGet
  # packages. It fails when one does not compile, and when an interface's outcome differs from the
  # one pinned in test/MockSweep/classifications.tsv. docs/design/mocks-shape-sweep.md has the triage.
  mock-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the swept packages
        run: dotnet build test/MockSweep.Packages -c Release

      - name: Build the sweep
        run: dotnet build test/MockSweep -c Release

      - name: Run the sweep
        id: sweep
        run: >
          dotnet run --project test/MockSweep -c Release --no-build --
          --references test/MockSweep.Packages/obj/sweep-references.txt --output artifacts/mock-sweep
          --classifications test/MockSweep/classifications.tsv

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f artifacts/mock-sweep/report.md ]; then
            cat artifacts/mock-sweep/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mock-sweep
          path: artifacts/mock-sweep/
          if-no-files-found: ignore

      - name: Write the run report
        if: always()
        env:
          SWEEP: ${{ steps.sweep.outcome || 'missing' }}
        run: dotnet run --project test/Hardening.Reports -c Release -- --output artifacts/evidence --step sweep mock-sweep "$SWEEP" -

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-report-mock-sweep
          path: artifacts/evidence/
          retention-days: 30
          if-no-files-found: ignore

  # The macOS arm64 and Windows x64 rows of the supported matrix. Each platform writes a run report.
  release-candidate:
    uses: ./.github/workflows/release-candidate.yml

  # The completion gate of docs/design/hardening.md. It reads the run reports of this run's jobs and fails
  # when an entry of the inventory has no passing evidence at this commit. A report made at another commit
  # does not count, so an earlier pass never stands in for this one.
  completion-gate:
    needs: [build, hardening, mock-sweep, release-candidate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # A job that failed before its upload leaves its entries out, and the gate then reports them.
      - name: Download the run reports
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: run-report-*
          path: artifacts/reports

      - name: Download the hardening run report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: hardening
          path: artifacts/reports/hardening

      - name: Check that every inventory entry has passing evidence at this commit
        run: |
          mapfile -t reports < <(find artifacts/reports -name run-report.json | sort)
          status=0
          dotnet run --project test/Hardening.Reports -c Release -- gate --commit "$(git rev-parse HEAD)" \
            --output artifacts/completion "${reports[@]}" || status=$?
          if [ -f artifacts/completion/completion.md ]; then
            cat artifacts/completion/completion.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: completion-gate
          path: artifacts/completion/
          retention-days: 30
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: 0.24.2
      VALE_VERSION: 3.27.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install lychee and Vale
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v$VALE_VERSION/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C "$bin" vale
          echo "$bin" >> "$GITHUB_PATH"

      - name: Check snippets, links and style
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: eng/check-docs.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/docs-site/package-lock.json

      # docs-pages.yml builds the same site, but only after a merge to main.
      - name: Build the docs site
        working-directory: spikes/docs-site
        run: |
          npm ci
          npm run build
