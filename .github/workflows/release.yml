name: Release

# Packs the four packages, checks them with eng/pack-and-consume.sh, and pushes them to nuget.org.
# docs/releasing.md has the steps.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version-suffix:
        description: The prerelease label, such as preview.2. The version is VersionPrefix in Directory.Build.props with this label.
        required: true

permissions:
  contents: write
  # nuget.org trusted publishing exchanges the workflow's OIDC token for a push key.
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            case "$version" in
              "$prefix"-*) suffix="${version#"$prefix"-}" ;;
              *) echo "::error::Tag $TAG does not match VersionPrefix $prefix with a prerelease label"; exit 1 ;;
            esac
          else
            suffix="$INPUT_SUFFIX"
            version="$prefix-$suffix"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Pack and check the packages
        env:
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: eng/pack-and-consume.sh "-p:VersionSuffix=$SUFFIX" -p:ContinuousIntegrationBuild=true

      # The feed also holds the package that eng/pack-and-consume.sh packs for its version mismatch check.
      - name: Collect the release packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts/release
          for package in VerificationGlue VerificationGlue.Mocks VerificationGlue.Tests VerificationGlue.Tests.AspNetCore; do
            cp "artifacts/pack-and-consume/feed/$package.$VERSION.nupkg" artifacts/release/ \
              || { echo "::error::No $package $VERSION package"; exit 1; }
          done

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/release/*.nupkg

      # The trusted publishing policy on nuget.org names this repository and release.yml.
      # The key lasts one hour.
      - name: Get a nuget.org push key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for package in VerificationGlue VerificationGlue.Mocks VerificationGlue.Tests VerificationGlue.Tests.AspNetCore; do
            dotnet nuget push "artifacts/release/$package.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v$VERSION" > /dev/null 2>&1 \
            || gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --generate-notes \
                 artifacts/release/*.nupkg
